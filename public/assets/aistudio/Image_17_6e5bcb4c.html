<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VibePlay Mobile - Track Actions &amp; Acoustic Details</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#1e1e24',
            surfaceBorder: '#2a2a35',
            surfaceMuted: '#16161a',
            cyanCustom: '#06b6d4',
            amberCustom: '#f59e0b',
            redCustom: '#ef4444',
            greenCustom: '#10b981',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-scroll-and-layout">
    /* Android status bar and gesture navigation feel */
    body {
      background-color: #08080a;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Smooth custom scrollbars for sheet content if viewport is constrained */
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Radial glow backdrop mimicking audiophile vibe */
    .sheet-glow {
      box-shadow: 0 -12px 36px -4px rgba(6, 182, 212, 0.08), 0 -2px 16px rgba(0, 0, 0, 0.75);
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 m-0 bg-[#08080a] font-sans antialiased text-[#e4e4e7]">
<!-- BEGIN: MobileFrameContainer -->
<!-- Target resolution 412x915 portrait (Android viewport standard) -->
<main class="relative w-[412px] h-[915px] max-h-[915px] bg-[#0c0d11] overflow-hidden flex flex-col justify-end shadow-2xl border border-[#1f2128]">
<!-- BEGIN: BackdropScreenPreview -->
<!-- Scrim & dimmed contextual background simulating Now Playing screen beneath sheet -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-30 blur-[2px] scale-95 origin-top transition-transform" data-purpose="dimmed-scrim-preview">
<!-- Simulated Top Bar -->
<div class="flex justify-between items-center px-6 pt-3 text-xs font-mono text-zinc-400">
<span>10:42</span>
<span class="text-cyanCustom font-semibold">Hi-Res Direct</span>
</div>
<!-- Simulated Ambient Glow & Album Art background -->
<div class="flex flex-col items-center mt-8 px-8">
<div class="w-64 h-64 rounded-2xl overflow-hidden shadow-2xl border border-white/10 opacity-70">
<img alt="Album background art" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1WB2WKLenRp-KxErM0wt9I9ZHX-8diPWcRYSfx8C5LTKZkESkMOFfPJgDl9z7qXHokeWP4pkaa5R5s-f6gPoPFiAzdAXBExKCdoWA3W7i3NhmbkdMKv2S0YeKwZ4yFZXsa85tD3A2pTTBufHCYAuOsCUk_5eNTWWBvXxGAXPAcyw5sDLLgUpPrrgEy42FAa_ulZ0rczgqSLKdEiC5aZy4E1v4MGxhVL_k-V7ofRBHaNognqJDgqAvA6cA"/>
</div>
<div class="mt-6 text-center">
<h2 class="text-xl font-bold text-white tracking-wide">Dead on Arrival</h2>
<p class="text-sm text-zinc-400 mt-1">Fall Out Boy</p>
</div>
</div>
</div>
<!-- Dimmer Overlay Scrim -->
<div class="absolute inset-0 z-10 bg-black/75 backdrop-blur-[3px]" data-purpose="modal-scrim"></div>
<!-- END: BackdropScreenPreview -->
<!-- BEGIN: BottomSheetModal -->
<section aria-label="Track Actions and Acoustic Information" class="relative z-20 w-full bg-[#1e1e24] border-t border-x border-[#2a2a35] rounded-t-[28px] sheet-glow flex flex-col max-h-[855px] overflow-hidden animate-in slide-in-from-bottom duration-200" data-purpose="bottom-sheet-container">
<!-- BEGIN: DragHandle -->
<div class="w-full pt-3 pb-2 flex justify-center items-center cursor-grab active:cursor-grabbing" data-purpose="sheet-drag-handle">
<div class="w-10 h-1 rounded-full bg-[#4b5563]/80"></div>
</div>
<!-- END: DragHandle -->
<!-- Scrollable content area -->
<div class="overflow-y-auto hide-scrollbar px-5 pb-2">
<!-- BEGIN: HeaderRow -->
<header class="flex items-center justify-between pb-4 pt-1 border-b border-[#2a2a35]" data-purpose="track-header-row">
<div class="flex items-center space-x-3.5 min-w-0">
<!-- 52x52dp Album Art Thumbnail -->
<div class="relative w-[52px] h-[52px] flex-shrink-0 rounded-[10px] overflow-hidden border border-white/10 shadow-md">
<img alt="Track Cover: Dead on Arrival" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1WB2WKLenRp-KxErM0wt9I9ZHX-8diPWcRYSfx8C5LTKZkESkMOFfPJgDl9z7qXHokeWP4pkaa5R5s-f6gPoPFiAzdAXBExKCdoWA3W7i3NhmbkdMKv2S0YeKwZ4yFZXsa85tD3A2pTTBufHCYAuOsCUk_5eNTWWBvXxGAXPAcyw5sDLLgUpPrrgEy42FAa_ulZ0rczgqSLKdEiC5aZy4E1v4MGxhVL_k-V7ofRBHaNognqJDgqAvA6cA"/>
</div>
<!-- Title & Artist Meta -->
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-1.5">
<h1 class="text-[17px] font-bold text-[#e4e4e7] tracking-tight truncate leading-snug">Dead on Arrival</h1>
</div>
<p class="text-[13px] text-[#9ca3af] truncate leading-tight mt-0.5">Fall Out Boy • Take This to Your Grave</p>
<!-- Badges Container -->
<div class="flex items-center gap-1.5 mt-1.5">
<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono font-medium text-cyanCustom bg-cyan-950/40 border border-cyanCustom/30 tracking-tight">
<span class="w-1.5 h-1.5 rounded-full bg-cyanCustom mr-1 inline-block animate-pulse"></span>
                  FLAC 24/96
                </span>
<span class="inline-flex items-center text-[10px] font-mono text-amberCustom/90 font-medium">
                  Hi-Res Direct ✨
                </span>
</div>
</div>
</div>
<!-- Dismiss Button -->
<button aria-label="Dismiss sheet" class="w-8 h-8 rounded-full bg-[#272730] hover:bg-[#32323e] active:scale-95 text-zinc-400 hover:text-white flex items-center justify-center transition border border-[#353545] flex-shrink-0 ml-2" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</button>
</header>
<!-- END: HeaderRow -->
<!-- BEGIN: AcousticFeaturesSection -->
<section class="py-3.5 border-b border-[#2a2a35]" data-purpose="acoustic-dials-row">
<div class="flex items-center justify-between px-0.5 mb-2.5">
<span class="text-[11px] font-mono uppercase tracking-wider text-zinc-400 font-semibold flex items-center gap-1">
<svg class="w-3.5 h-3.5 text-cyanCustom" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
              Acoustic Profile
            </span>
<span class="text-[10px] font-mono text-cyan-400/80 bg-cyan-950/30 px-2 py-0.5 rounded-full border border-cyan-800/40">
              Local Heuristic Engine
            </span>
</div>
<!-- Dials Grid -->
<div class="grid grid-cols-3 gap-2 text-center">
<!-- Dial 1: Tempo / BPM -->
<div class="bg-[#17171d] rounded-xl p-2.5 border border-[#262631] flex flex-col items-center justify-center relative overflow-hidden group hover:border-cyanCustom/30 transition">
<div class="relative w-14 h-14 flex items-center justify-center mb-1">
<!-- SVG circular gauge -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<path class="text-zinc-800" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"></path>
<path class="text-cyanCustom/80" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="75, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="text-[12px] font-bold font-mono tracking-tight text-white leading-none">138</span>
<span class="text-[8px] font-mono text-cyanCustom font-semibold uppercase mt-0.5 leading-none">BPM</span>
</div>
</div>
<span class="text-[11px] font-medium text-zinc-300 flex items-center gap-0.5">
                Tempo <span class="text-[10px]">⚡</span>
</span>
<span class="text-[9px] font-mono text-zinc-400">Allegro Fast</span>
</div>
<!-- Dial 2: Energy -->
<div class="bg-[#17171d] rounded-xl p-2.5 border border-[#262631] flex flex-col items-center justify-center relative overflow-hidden group hover:border-cyanCustom/30 transition">
<div class="relative w-14 h-14 flex items-center justify-center mb-1">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<path class="text-zinc-800" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"></path>
<path class="text-cyanCustom" fill="none" stroke="currentColor" stroke-dasharray="84, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="text-[13px] font-extrabold font-mono tracking-tight text-white leading-none">84%</span>
</div>
</div>
<span class="text-[11px] font-medium text-zinc-300 flex items-center gap-0.5">
                Energy <span class="text-[10px]">🔥</span>
</span>
<span class="text-[9px] font-mono text-cyanCustom font-medium">Aggressive</span>
</div>
<!-- Dial 3: Danceability -->
<div class="bg-[#17171d] rounded-xl p-2.5 border border-[#262631] flex flex-col items-center justify-center relative overflow-hidden group hover:border-amberCustom/30 transition">
<div class="relative w-14 h-14 flex items-center justify-center mb-1">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<path class="text-zinc-800" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"></path>
<path class="text-amberCustom" fill="none" stroke="currentColor" stroke-dasharray="68, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="text-[13px] font-extrabold font-mono tracking-tight text-white leading-none">68%</span>
</div>
</div>
<span class="text-[11px] font-medium text-zinc-300 flex items-center gap-0.5">
                Dance <span class="text-[10px]">💃</span>
</span>
<span class="text-[9px] font-mono text-amberCustom font-medium">Punchy</span>
</div>
</div>
</section>
<!-- END: AcousticFeaturesSection -->
<!-- BEGIN: ActionListItems -->
<nav aria-label="Track Action Controls" class="py-2 space-y-1.5" data-purpose="action-list-items">
<!-- Row 1: Play Next -->
<button class="w-full min-h-[52px] px-3.5 py-2 rounded-xl flex items-center justify-between text-left hover:bg-[#25252e] active:bg-[#2a2a34] transition group border border-transparent hover:border-[#2d2d3a]" type="button">
<div class="flex items-center space-x-3.5">
<!-- Cyan Tinted Icon Badge -->
<div class="w-9 h-9 rounded-lg bg-cyan-950/60 border border-cyan-500/30 flex items-center justify-center text-cyanCustom flex-shrink-0 group-hover:scale-105 transition-transform">
<svg class="w-4 h-4 translate-x-0.5" fill="currentColor" viewbox="0 0 24 24">
<path d="M5.5 4.5v15l14-7.5-14-7.5z"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="text-[14px] font-semibold text-white group-hover:text-cyanCustom transition-colors">Play Next in Queue</span>
<span class="text-[11px] text-[#9ca3af]">Append right after current track</span>
</div>
</div>
<svg class="w-4 h-4 text-zinc-500 group-hover:text-zinc-300 group-hover:translate-x-0.5 transition" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Row 2: Add to Vibe Cooker Staging -->
<button class="w-full min-h-[52px] px-3.5 py-2 rounded-xl flex items-center justify-between text-left hover:bg-[#25252e] active:bg-[#2a2a34] transition group border border-transparent hover:border-[#2d2d3a]" type="button">
<div class="flex items-center space-x-3.5">
<!-- Amber/Cyan Badge -->
<div class="w-9 h-9 rounded-lg bg-amber-950/40 border border-amberCustom/30 flex items-center justify-center text-amberCustom flex-shrink-0 group-hover:scale-105 transition-transform">
<span class="text-[16px] leading-none">🍳</span>
</div>
<div class="flex flex-col">
<div class="flex items-center gap-1.5">
<span class="text-[14px] font-semibold text-white group-hover:text-amberCustom transition-colors">Add to Vibe Cooker Staging</span>
</div>
<span class="text-[11px] text-[#9ca3af]">Send acoustic vectors into prompt generator</span>
</div>
</div>
<span class="px-1.5 py-0.5 rounded text-[9px] font-mono uppercase bg-amber-500/10 text-amberCustom border border-amberCustom/20 font-semibold">Stage</span>
</button>
<!-- Row 3: Add to Favorites -->
<button class="w-full min-h-[52px] px-3.5 py-2 rounded-xl flex items-center justify-between text-left hover:bg-[#25252e] active:bg-[#2a2a34] transition group border border-transparent hover:border-[#2d2d3a]" type="button">
<div class="flex items-center space-x-3.5">

</div>
<div class="flex flex-col">

</div>
</div>
<span class="text-[11px] font-mono text-zinc-500">Starred</span>
</button>

<button class="w-full min-h-[52px] px-3.5 py-2 rounded-xl flex items-center justify-between text-left hover:bg-[#25252e] active:bg-[#2a2a34] transition group border border-transparent hover:border-[#2d2d3a]" type="button">
<div class="flex items-center space-x-3.5">
<!-- Waveform / Search Icon Badge -->
<div class="w-9 h-9 rounded-lg bg-teal-950/40 border border-teal-500/30 flex items-center justify-center text-teal-400 flex-shrink-0 group-hover:scale-105 transition-transform">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16zM8 11h.01M11 11h.01M14 11h.01" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="text-[14px] font-semibold text-white group-hover:text-teal-300 transition-colors">Find Tracks with Similar Tempo</span>
<span class="text-[11px] text-[#9ca3af]">Harmonic energy match</span>
</div>
</div>
<!-- ±5 BPM Badge Pill -->
<span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-medium text-cyanCustom bg-cyan-950/50 border border-cyan-800/40">
              ±5 BPM (133-143)
            </span>
</button>
<!-- Row 5: View Technical Audio Specs -->
<button class="w-full min-h-[52px] px-3.5 py-2 rounded-xl flex items-center justify-between text-left hover:bg-[#25252e] active:bg-[#2a2a34] transition group border border-transparent hover:border-[#2d2d3a]" type="button">
<div class="flex items-center space-x-3.5">

</svg>
</div>
<div class="flex flex-col">
<span class="text-[14px] font-semibold text-white group-hover:text-indigo-300 transition-colors">View Technical Audio Specs</span>
<span class="text-[11px] font-mono text-[#9ca3af]">FLAC • 3,028 kbps • 24b/96kHz • 2ch</span>
</div>
</div>
<svg class="w-4 h-4 text-zinc-500 group-hover:text-zinc-300" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Row 6: Remove from Device (Destructive Action) -->
<button class="w-full min-h-[52px] px-3.5 py-2 rounded-xl flex items-center justify-between text-left hover:bg-red-950/20 active:bg-red-950/40 transition group border border-transparent hover:border-red-900/30" type="button">
<div class="flex items-center space-x-3.5">
<!-- Danger Icon Badge -->
<div class="w-9 h-9 rounded-lg bg-red-950/40 border border-red-500/30 flex items-center justify-center text-redCustom flex-shrink-0 group-hover:scale-105 transition-transform">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="text-[14px] font-semibold text-redCustom tracking-tight">Remove from Device</span>

</div>
</div>
<span class="text-[10px] font-mono text-red-400/80 font-medium">Delete</span>
</button>
</nav>

</div>

<footer class="w-full pt-2 pb-3 flex justify-center items-center bg-[#1e1e24]" data-purpose="android-gesture-bar">
<!-- 108x4dp Android Home Indicator Bar -->
<div class="w-[108px] h-1 rounded-full bg-[#71717a]/70"></div>
</footer>
<!-- END: AndroidHomeBar -->
</section>
<!-- END: BottomSheetModal -->
</main>
<!-- END: MobileFrameContainer -->
</body></html>
